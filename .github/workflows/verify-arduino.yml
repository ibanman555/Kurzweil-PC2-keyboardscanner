name: Verify Arduino Mega build

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Mega AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Install DIO2
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "DIO2@1.6.1"

      - name: Verify PC2 mapping
        run: python3 keyboardscanner/tests/verify_pc2.py

      - name: Compile for Arduino Mega 2560
        run: arduino-cli compile --fqbn arduino:avr:mega --warnings all keyboardscanner
